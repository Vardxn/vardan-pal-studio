<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; padding: 72px 80px; background: #f7f4ee; color: #1c1b19; font-family: Manrope, sans-serif; display: grid; align-content: space-between; position: relative; overflow: hidden; }
  body::before { content: ""; position: absolute; width: 760px; height: 760px; right: -180px; top: -260px; background: radial-gradient(closest-side, rgba(183,155,106,.3), transparent); }
  .top { position: relative; font-size: 20px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #7a6540; }
  h1 { position: relative; max-width: 900px; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 84px; line-height: 1.04; letter-spacing: -.025em; }
  .bottom { position: relative; display: flex; justify-content: space-between; font-size: 24px; color: #6a655b; }
  .bottom b { color: #1c1b19; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">Digital studio · New Delhi</div>
  <h1>Your business deserves a better digital presence.</h1>
  <div class="bottom"><span><b>Vardan Pal</b> · Websites, business tools and digital experiences</span><span>From ₹3,000</span></div>
</body>
</html>
